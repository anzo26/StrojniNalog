services:
  postgres:
    image: postgres:18
    container_name: strojninalog-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
    
    networks:
      - strojninalog

  keycloak-db-init:
    image: postgres:18
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      KEYCLOAK_DB: ${KEYCLOAK_DB}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Nastavi KEYCLOAK_DB_PASSWORD}
    volumes:
      - ./docker/postgres/init-keycloak.sql:/init-keycloak.sql:ro
    tmpfs:
      - /var/lib/postgresql
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/init-keycloak.sql"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - strojninalog

  app-db-init:
    image: postgres:18
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Nastavi APP_DB_PASSWORD}
    volumes:
      - ./docker/postgres/init-app.sql:/init-app.sql:ro
    tmpfs:
      - /var/lib/postgresql
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/init-app.sql"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - strojninalog

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: strojninalog-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KEYCLOAK_SERVICE_CLIENT_SECRET: ${KEYCLOAK_SERVICE_CLIENT_SECRET:?Nastavi KEYCLOAK_SERVICE_CLIENT_SECRET}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT}:8080"
    volumes:
      - ./docker/keycloak/strojninalog-realm.json:/opt/keycloak/data/import/strojninalog-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          { printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0;
          grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - strojninalog

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: strojninalog-api:local
    container_name: strojninalog-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${APP_DB_USER};Password=${APP_DB_PASSWORD}"
      Database__ApplyMigrations: "true"
      HttpsRedirection__Enabled: "false"
      Keycloak__Authority: "http://localhost:${KEYCLOAK_PORT}/realms/strojninalog"
      Keycloak__Audience: strojninalog-api
      Keycloak__MetadataAddress: "http://keycloak:8080/realms/strojninalog/.well-known/openid-configuration"
      KeycloakAdmin__BaseUrl: "http://keycloak:8080"
      KeycloakAdmin__Realm: strojninalog
      KeycloakAdmin__ClientId: strojninalog-admin-reader
      KeycloakAdmin__ClientSecret: ${KEYCLOAK_SERVICE_CLIENT_SECRET:?Nastavi KEYCLOAK_SERVICE_CLIENT_SECRET}
      Cors__AllowedOrigins__0: "http://localhost:5173"
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      app-db-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://localhost:8080/health/ready
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - strojninalog

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:${BACKEND_PORT}"
        VITE_KEYCLOAK_URL: "http://localhost:${KEYCLOAK_PORT}"
        VITE_KEYCLOAK_REALM: strojninalog
        VITE_KEYCLOAK_CLIENT_ID: strojninalog-frontend
    image: strojninalog-web:local
    container_name: strojninalog-web
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - strojninalog

volumes:
  postgres_data:

networks:
  strojninalog:
   name: strojninalog-net